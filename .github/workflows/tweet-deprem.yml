name: Auto Tweet Deprem

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir
  workflow_dispatch:        # Manuel tetikleme

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Tweet deprem
        run: |
          RESPONSE=$(curl -s -G \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://depremhatti.com/api/cron/tweet-deprem")
          echo "API Yanıtı: $RESPONSE"
